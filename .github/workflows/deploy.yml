name: Deploy elo-lab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-2

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar e checar sintaxe
        run: |
          for s in api worker; do
            (cd $s && npm install --no-audit --no-fund && node --check src/index.js)
          done

  deploy:
    needs: verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A conta no modelo novo da AWS (projetos) não permite o login por OIDC,
      # então usamos a chave de um usuário que só pode enviar imagens e disparar o deploy.
      - name: Login na AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e envio das imagens
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          for s in api worker; do
            docker build -t $REGISTRY/elo-lab-$s:$TAG -t $REGISTRY/elo-lab-$s:latest ./$s
            docker push --all-tags $REGISTRY/elo-lab-$s
          done

      - name: Deploy na EC2 via SSM
        env:
          TAG: ${{ github.sha }}
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy $TAG" \
            --parameters "commands=[\"cd /opt/elo-lab && git pull --ff-only && bash scripts/deploy.sh $TAG\"]" \
            --query Command.CommandId --output text)
          echo "Comando SSM: $CMD_ID"
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text)
          echo "Status: $STATUS"
          test "$STATUS" = "Success"
